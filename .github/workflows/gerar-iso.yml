name: Gerar ISO Nova Informatica BenchOS

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão da ISO"
        default: "1.0"
      jogos:
        description: "Incluir jogos (Steam, Lutris)? Deixa a ISO bem maior"
        type: choice
        options: [nao, sim]
        default: nao
      nvidia:
        description: "Embutir driver NVIDIA?"
        type: choice
        options: [nao, sim]
        default: nao
  push:
    branches: [main]
    paths:
      - "build/**"
      - "packages/**"
      - "scripts/**"
      - "branding/**"
      - "installer/**"
      - "ferramentas/**"

concurrency:
  group: gerar-iso
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force || true
          df -h /

      - name: Construir a ISO
        env:
          VERSAO: ${{ github.event.inputs.versao || '1.0' }}
          INSTALAR_JOGOS: ${{ github.event.inputs.jogos || 'nao' }}
          INSTALAR_NVIDIA: ${{ github.event.inputs.nvidia || 'nao' }}
        run: sudo -E bash build/build-iso.sh

      - name: Disponibilizar a ISO para download
        uses: actions/upload-artifact@v4
        with:
          name: NovaInformatica-BenchOS-ISO
          path: releases/*.iso
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar o log da instalação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-instalacao
          path: releases/*.log
          if-no-files-found: ignore
