
name: Build Nova Informatica BenchOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Configurar sistema Debian
        run: |
          lb config \
            --distribution bookworm \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components locales=pt_BR.UTF-8 keyboard-layouts=br"

      - name: Adicionar ferramentas da bancada
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/benchos.list.chroot <<'EOF'
          xfce4
          lightdm
          firefox-esr
          gparted
          gsmartcontrol
          smartmontools
          nvme-cli
          testdisk
          clonezilla
          htop
          pciutils
          usbutils
          lshw
          inxi
          curl
          wget
          git
          sudo
          network-manager
          EOF

      - name: Gerar ISO
        run: sudo lb build

      - name: Disponibilizar ISO
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Informatica-BenchOS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
