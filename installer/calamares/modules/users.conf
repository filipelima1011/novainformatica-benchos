---
defaultGroups:
    - name: adm
    - name: sudo
    - name: plugdev
    - name: dialout
    - name: lpadmin
    - name: disk
    - name: wireshark
      must_exist: false
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
doReusePassword: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    minLength: 4
    maxLength: -1
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "benchos-${cpu}"
