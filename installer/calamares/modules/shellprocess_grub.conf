# Instala o GRUB certo para o tipo de inicialização (UEFI com Secure Boot ou BIOS)
# usando os pacotes guardados na ISO (não precisa de internet)
---
dontChroot: false
timeout: 600
script:
    - command: "export DEBIAN_FRONTEND=noninteractive; cd /var/cache/benchos-debs && if [ -d /sys/firmware/efi ]; then dpkg -i grub-efi-amd64_*.deb grub-efi-amd64-signed_*.deb mokutil_*.deb shim-signed_*.deb; else dpkg -i grub-pc_*.deb; fi"
      timeout: 600
