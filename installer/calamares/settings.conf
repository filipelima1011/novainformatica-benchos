# Nova Informática BenchOS - configuração do instalador (Calamares)
---
modules-search: [ local ]

instances:
- id: limpeza
  module: shellprocess
  config: shellprocess_limpeza.conf
- id: grub
  module: shellprocess
  config: shellprocess_grub.conf
- id: finalizar
  module: shellprocess
  config: shellprocess_finalizar.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@limpeza
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@grub
  - bootloader
  - shellprocess@finalizar
  - umount
- show:
  - finished

branding: benchos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
